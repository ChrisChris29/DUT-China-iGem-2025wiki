<style>
  footer a { color: white; font-weight: bold; text-decoration: none; }
  footer a:hover { color: white; text-decoration: underline; }
  /* ===== 图片Footer样式 ===== */
    .image-footer {
        background-image: url('https://static.igem.wiki/teams/5844/footer/footer1.webp');
        background-size: cover; /* 改为cover以更好适应不同屏幕 */
        background-position: center bottom; 
        background-repeat: no-repeat;
        position: relative;
        width: 100%; /* 使用100%而非100vw避免横向滚动 */
        min-height: 200px; /* 设置最小高度确保内容可见 */
        margin: 0;
        padding: 0;
        padding-bottom: 40%; /* 控制背景图显示比例 */
        overflow: hidden;
        margin-top: auto; /* 这会将footer推到页面底部 */
    }
    
    .footer-overlay {
        background: rgba(0, 0, 0, 0.6);
        width: 100%;
        padding: 0px 0; /* 增加内边距让内容更舒适 */
        position: absolute;
        bottom: 0; /* 调整到底部 */
        left: 0;
        right: 0;
    }
    
    .footer-text {
        text-align: center; /* 文字居中 */
        color: white;
        padding: 0 20px;
        margin: 0 auto; /* 水平居中 */
        max-width: 1200px; /* 限制最大宽度，在宽屏上更美观 */
        padding-bottom: -20px;
    }
    
    .footer-text a {
        color: #fff;
        font-weight: bold;
        text-decoration: none;
    }
    
    .footer-text a:hover {
        text-decoration: underline;
        color: #e0e0e0;
    }
 </style>
